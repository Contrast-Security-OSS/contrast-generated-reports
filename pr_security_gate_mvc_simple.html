<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Security Gate Dashboard - MVC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e4e4e7;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            color: #a1a1aa;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 40px;
            font-size: 1.5em;
        }

        #error-message {
            display: none;
            background: rgba(255,68,68,0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid rgba(255,68,68,0.5);
        }

        .gate-status {
            background: rgba(39, 39, 42, 0.5);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .status-passed {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .status-blocked {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .status-warning {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        .gate-icon {
            font-size: 4em;
        }

        .gate-details {
            flex: 1;
        }

        .gate-details h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .gate-details p {
            font-size: 1.1em;
            color: #a1a1aa;
            margin-bottom: 20px;
        }

        .gate-metrics {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .metric {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .metric-label {
            color: #a1a1aa;
            font-size: 0.9em;
            margin-right: 5px;
        }

        .metric-value {
            font-weight: 600;
            font-size: 1.2em;
        }

        #vulnerabilities-container,
        #recommendations-container {
            margin-bottom: 30px;
        }

        .vuln-section {
            background: rgba(39, 39, 42, 0.5);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid;
        }

        .vuln-critical {
            border-left-color: #ef4444;
        }

        .vuln-high {
            border-left-color: #f59e0b;
        }

        .vuln-medium {
            border-left-color: #eab308;
        }

        .vuln-low {
            border-left-color: #3b82f6;
        }

        .vuln-section h3 {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .vuln-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .vuln-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vuln-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 5px;
        }

        .vuln-title {
            font-weight: 600;
            color: #fff;
        }

        .vuln-app {
            font-size: 0.9em;
            color: #a1a1aa;
        }

        .vuln-id {
            font-size: 0.85em;
            color: #71717a;
            font-family: monospace;
        }

        .recommendations {
            background: rgba(39, 39, 42, 0.5);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #3f3f46;
        }

        .recommendations h3 {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .recommendation-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .recommendation-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid;
        }

        .priority-critical {
            border-left-color: #ef4444;
        }

        .priority-high {
            border-left-color: #f59e0b;
        }

        .priority-medium {
            border-left-color: #eab308;
        }

        .priority-low {
            border-left-color: #3b82f6;
        }

        .no-vulnerabilities {
            text-align: center;
            padding: 60px;
            color: #22c55e;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🔒 PR Security Gate Dashboard</h1>
            <p>Automated security evaluation for pull requests</p>
        </div>

        <div id="loading" style="display:none;">
            <p>Evaluating PR security...</p>
        </div>

        <div id="error-message" style="display:none;"></div>

        <div id="gate-status"></div>
        <div id="recommendations-container"></div>
        <div id="vulnerabilities-container"></div>
    </div>

    <!-- MVC JavaScript -->
    <script type="module">
        // Import MVC classes and ConfigLoader
        import { ConfigLoader } from './src/utils/ConfigLoader.js';
        import { PocGeneratorModel } from './src/models/PocGeneratorModel.js';
        import { PRSecurityGateController } from './src/controllers/PRSecurityGateController.js';
        import { PRSecurityGateView } from './src/views/PRSecurityGateView.js';
        import { PocGeneratorController } from './src/controllers/PocGeneratorController.js';

        // Load credentials from .creds file
        await ConfigLoader.init();

        // Initialize MVC
        const model = new PocGeneratorModel(); // Reuse model for fetching vulnerabilities
        const controller = new PRSecurityGateController();
        const pocController = new PocGeneratorController(); // For enrichment
        const view = new PRSecurityGateView();

        // Main application logic
        async function loadDashboard() {
            try {
                view.showLoading();
                view.hideError();

                // Fetch vulnerabilities (Model)
                const vulns = await model.fetchVulnerabilities({
                    severities: ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'],
                    limit: 50
                });

                // Enrich vulnerabilities (Controller)
                const enrichedVulns = vulns.map(vuln =>
                    pocController.enrichVulnerability(vuln)
                );

                // Evaluate PR security (Controller)
                const evaluation = controller.evaluatePRSecurity(enrichedVulns, {
                    blockOnCritical: true,
                    blockOnHigh: false
                });

                // Categorize vulnerabilities (Controller)
                const categorized = controller.categorizeByRiskLevel(enrichedVulns);

                // Generate report (Controller)
                const report = controller.generateSecurityReport(evaluation);

                // Get recommendations (Controller)
                const recommendations = controller.getActionableRecommendations(enrichedVulns);

                // Render (View)
                view.renderGateStatus(evaluation);
                view.renderRecommendations(report.recommendations.concat(recommendations.slice(0, 5)));
                view.renderVulnerabilities(categorized);

                view.hideLoading();

                console.log(`PR Security Gate: ${evaluation.status}`);
                console.log(`Total vulnerabilities: ${evaluation.totalCount}`);
                console.log(`Blocking: ${evaluation.blocking}`);
            } catch (error) {
                view.hideLoading();
                view.showError(`Failed to load dashboard: ${error.message}`);
                console.error('Dashboard error:', error);
            }
        }

        // Start the application
        loadDashboard();
    </script>
</body>
</html>
