<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerability Proof-of-Concept Generator - MVC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 40px;
            font-size: 1.5em;
        }

        #error-message {
            display: none;
            background: rgba(255,68,68,0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid rgba(255,68,68,0.5);
        }

        #vulnerabilities-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .vuln-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .vuln-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .vuln-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .vuln-title h2 {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .vuln-id {
            font-family: monospace;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
        }

        .severity-critical {
            background: #ff4444;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .severity-high {
            background: #ff8800;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .severity-medium {
            background: #ffaa00;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .vuln-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .meta-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .meta-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .meta-value {
            color: #fff;
            font-weight: 500;
        }

        .section-title {
            color: #667eea;
            font-size: 1.4em;
            margin: 30px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }

        .code-section {
            margin: 20px 0;
        }

        .code-section h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .code-block {
            background: #282c34;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .code-block pre {
            margin: 0;
            color: #abb2bf;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .http-request {
            background: #1a1d26;
            border-left: 4px solid #61dafb;
        }

        .exploit-request {
            background: #1a1d26;
            border-left: 4px solid #ff6b6b;
        }

        .recommendation {
            background: rgba(102, 234, 144, 0.1);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #66ea90;
            margin-top: 20px;
        }

        .recommendation h4 {
            color: #66ea90;
            margin-bottom: 10px;
        }

        .no-vulnerabilities,
        .no-poc {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 Vulnerability Proof-of-Concept Generator</h1>
            <p>Generate exploitable PoCs for discovered vulnerabilities</p>
        </header>

        <div id="loading" style="display:none;">
            <p>Loading vulnerabilities and generating PoCs...</p>
        </div>

        <div id="error-message" style="display:none;"></div>

        <div id="vulnerabilities-container"></div>
    </div>

    <!-- MVC JavaScript -->
    <script type="module">
        // Import MVC classes and ConfigLoader
        import { ConfigLoader } from './src/utils/ConfigLoader.js';
        import { PocGeneratorModel } from './src/models/PocGeneratorModel.js';
        import { PocGeneratorController } from './src/controllers/PocGeneratorController.js';
        import { PocGeneratorView } from './src/views/PocGeneratorView.js';

        // Load credentials from .creds file
        await ConfigLoader.init();

        // Initialize MVC
        const model = new PocGeneratorModel();
        const controller = new PocGeneratorController();
        const view = new PocGeneratorView();

        // Main application logic
        async function loadDashboard() {
            try {
                view.showLoading();
                view.hideError();

                // Fetch vulnerabilities with details (Model)
                const vulns = await model.fetchVulnerabilitiesWithDetails({
                    severities: ['CRITICAL', 'HIGH'],
                    limit: 10
                });

                if (vulns.length === 0) {
                    view.hideLoading();
                    view.showError('No critical or high vulnerabilities found');
                    return;
                }

                // Transform data (Controller)
                const enrichedVulns = vulns.map(vuln => {
                    const enriched = controller.enrichVulnerability(vuln);
                    const pocCode = controller.extractPocCode(vuln);

                    // Generate curl command if HTTP request available
                    if (pocCode.httpRequest) {
                        pocCode.curlCommand = controller.generateCurlCommand(
                            pocCode.httpRequest,
                            'https://example.com'
                        );
                    }

                    return {
                        ...enriched,
                        pocCode
                    };
                });

                // Sort by severity (Controller)
                const sortedVulns = controller.sortBySeverity(enrichedVulns);

                // Render (View)
                view.renderVulnerabilities(sortedVulns);

                view.hideLoading();

                // Highlight code blocks
                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });

                console.log(`Loaded ${sortedVulns.length} vulnerabilities with PoCs`);
            } catch (error) {
                view.hideLoading();
                view.showError(`Failed to load dashboard: ${error.message}`);
                console.error('Dashboard error:', error);
            }
        }

        // Start the application
        loadDashboard();
    </script>
</body>
</html>
