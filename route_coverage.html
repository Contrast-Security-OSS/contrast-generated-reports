<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Coverage Analysis - MVC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 40px;
            font-size: 1.5em;
        }

        #error-message {
            display: none;
            background: rgba(255,68,68,0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid rgba(255,68,68,0.5);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .stat-label {
            font-size: 0.9em;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            color: #667eea;
        }

        .section-title {
            color: #667eea;
            font-size: 2em;
            margin: 40px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }

        #apps-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
        }

        .app-card.coverage-high::before {
            background: linear-gradient(180deg, #00ff88 0%, #00cc66 100%);
        }

        .app-card.coverage-medium::before {
            background: linear-gradient(180deg, #ffaa00 0%, #dd9900 100%);
        }

        .app-card.coverage-low::before {
            background: linear-gradient(180deg, #ff4444 0%, #dd3333 100%);
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .app-header h3 {
            font-size: 1.3em;
            color: #667eea;
            flex: 1;
        }

        .coverage-badge {
            background: rgba(102, 126, 234, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1.2em;
            font-weight: 700;
            color: #fff;
        }

        .app-stats {
            margin: 20px 0;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .stat-label {
            color: #9ca3af;
        }

        .stat-value {
            font-weight: 600;
        }

        .stat-exercised {
            color: #4ade80;
        }

        .stat-discovered {
            color: #fb923c;
        }

        .coverage-bar {
            margin-top: 15px;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .coverage-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: 600;
        }

        #gaps-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        .gaps-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .gap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255,68,68,0.1);
            border-radius: 8px;
            border-left: 3px solid #ff4444;
        }

        .gap-signature {
            font-family: 'Courier New', monospace;
            color: #fff;
        }

        .gap-badge {
            background: rgba(255,68,68,0.3);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            color: #fca5a5;
        }

        .no-gaps {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #4ade80;
        }

        .gaps-more {
            text-align: center;
            padding: 12px;
            color: #9ca3af;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛣️ Route Coverage Analysis</h1>
            <p>Comprehensive API testing coverage across microservices</p>
        </header>

        <div id="loading" style="display:none; text-align:center; padding:40px;">
            <p style="font-size:1.5em;">Loading route coverage data...</p>
        </div>

        <div id="error-message" style="display:none;"></div>

        <!-- Overall Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Overall Coverage</div>
                <div class="stat-number" id="overall-coverage">0</div>
                <div style="font-size:0.8em; color:#9ca3af; margin-top:5px;">percentage</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Routes</div>
                <div class="stat-number" id="total-routes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Exercised</div>
                <div class="stat-number" id="exercised-routes" style="color:#4ade80;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Discovered</div>
                <div class="stat-number" id="discovered-routes" style="color:#fb923c;">0</div>
            </div>
        </div>

        <!-- Per-App Coverage -->
        <h2 class="section-title">📊 Coverage by Microservice</h2>
        <div id="apps-container"></div>

        <!-- Coverage Gaps -->
        <h2 class="section-title">⚠️ Coverage Gaps</h2>
        <div id="gaps-container"></div>
    </div>

    <!-- MVC JavaScript -->
    <script type="module">
        // Import MVC classes and ConfigLoader
        import { ConfigLoader } from './src/utils/ConfigLoader.js';
        import { RouteCoverageModel } from './src/models/RouteCoverageModel.js';
        import { RouteCoverageController } from './src/controllers/RouteCoverageController.js';
        import { RouteCoverageView } from './src/views/RouteCoverageView.js';

        // Load credentials from .creds file
        await ConfigLoader.init();

        // Microservices configuration
        const MICROSERVICES = [
            { appId: 'f1df5e87-5088-42a3-be76-5bdd4457cbb3', appName: 'cargo-cats-frontgateservice' },
            { appId: 'bd4637f1-9976-4036-ad33-b2275417d141', appName: 'cargo-cats-dataservice' },
            { appId: 'e6035803-486c-4976-8b53-3cf307ba8cc1', appName: 'cargo-cats-webhookservice' },
            { appId: 'bc1f622b-27de-4b0e-8521-ab7ba2b42208', appName: 'cargo-cats-docservice' },
            { appId: '84e7660a-5b4c-4770-951d-f9abf023a8c8', appName: 'cargo-cats-imageservice' },
            { appId: '9b762b48-fc24-4ab1-9847-124475fbd2f1', appName: 'cargo-cats-labelservice' }
        ];

        // Initialize MVC
        const model = new RouteCoverageModel();
        const controller = new RouteCoverageController();
        const view = new RouteCoverageView();

        // Main application logic
        async function loadDashboard() {
            try {
                view.showLoading();
                view.hideError();

                // Fetch route coverage for all microservices (Model)
                const appsData = await model.fetchWithMetadata(MICROSERVICES);

                if (appsData.length === 0) {
                    view.hideLoading();
                    view.showError('No route coverage data found or API error');
                    return;
                }

                // Transform and calculate (Controller)
                const aggregated = controller.aggregateApps(appsData);
                const sortedApps = controller.sortByCoverage(aggregated.apps, 'asc'); // Show lowest coverage first

                // Collect all gaps across all apps
                const allGaps = appsData.flatMap(app =>
                    controller.identifyGaps(app.routes || [])
                );

                // Render (View)
                view.updateOverallStats(aggregated);
                view.renderAppCards(sortedApps);
                view.renderGaps(allGaps, 20); // Show top 20 gaps

                view.hideLoading();

                console.log(`Loaded coverage for ${aggregated.totalApps} microservices`);
                console.log(`Overall coverage: ${aggregated.overallCoverage}%`);
                console.log(`Total gaps: ${allGaps.length}`);
            } catch (error) {
                view.hideLoading();
                view.showError(`Failed to load dashboard: ${error.message}`);
                console.error('Dashboard error:', error);
            }
        }

        // Start the application
        loadDashboard();
    </script>
</body>
</html>
