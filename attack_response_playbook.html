<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attack Event Response Playbook - MVC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e2e8f0;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 40px;
            font-size: 1.5em;
        }

        #error-message {
            display: none;
            background: rgba(255,68,68,0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid rgba(255,68,68,0.5);
        }

        .attack-banner {
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .status-critical {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border: 2px solid #ef4444;
        }

        .status-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: 2px solid #fbbf24;
        }

        .status-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 2px solid #34d399;
        }

        .banner-content h2 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: white;
        }

        .incident-id {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            opacity: 0.9;
            color: #f0f4ff;
        }

        .attack-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-item {
            background: rgba(26, 31, 58, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .summary-label {
            display: block;
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .severity-critical {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
        }

        .severity-high {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .severity-medium {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            color: white;
        }

        .risk-score {
            font-size: 1.5em;
            font-weight: 700;
            color: #667eea;
        }

        #response-plan {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .plan-section {
            background: rgba(26, 31, 58, 0.8);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 25px;
        }

        .plan-section h3 {
            color: #a5b4fc;
            font-size: 1.3em;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .action-list {
            list-style: none;
        }

        .action-item {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .detail-card {
            background: rgba(26, 31, 58, 0.8);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 25px;
        }

        .detail-card h3 {
            color: #a5b4fc;
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
        }

        .detail-label {
            color: #94a3b8;
            font-weight: 500;
        }

        .detail-value {
            font-weight: 600;
            color: #e2e8f0;
        }

        .detail-value.code {
            font-family: 'Courier New', monospace;
            background: rgba(102, 126, 234, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .vector-list, .app-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vector-item, .app-item {
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .no-data, .no-actions {
            color: #94a3b8;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" style="display:none;">
            <p>Loading attack incident data...</p>
        </div>

        <div id="error-message" style="display:none;"></div>

        <div id="attack-header"></div>

        <h2 style="color: #667eea; font-size: 2em; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid rgba(102, 126, 234, 0.3);">
            📋 Incident Response Playbook
        </h2>
        <div id="response-plan"></div>

        <h2 style="color: #667eea; font-size: 2em; margin: 40px 0 20px; padding-bottom: 10px; border-bottom: 2px solid rgba(102, 126, 234, 0.3);">
            🔍 Attack Details
        </h2>
        <div id="attack-details"></div>
    </div>

    <!-- MVC JavaScript -->
    <script type="module">
        // Import MVC classes and ConfigLoader
        import { ConfigLoader } from './src/utils/ConfigLoader.js';
        import { AttackModel } from './src/models/AttackModel.js';
        import { AttackPlaybookController } from './src/controllers/AttackPlaybookController.js';
        import { AttackPlaybookView } from './src/views/AttackPlaybookView.js';

        // Load credentials from .creds file
        await ConfigLoader.init();

        // Initialize MVC
        const model = new AttackModel();
        const controller = new AttackPlaybookController();
        const view = new AttackPlaybookView();

        // Main application logic
        async function loadDashboard() {
            try {
                view.showLoading();
                view.hideError();

                // Fetch attacks (Model)
                const attacks = await model.fetchAttacks({ limit: 20 });

                if (attacks.length === 0) {
                    view.hideLoading();
                    view.showError('No attack incidents found');
                    return;
                }

                // Prioritize attacks (Controller)
                const prioritized = controller.prioritizeAttacks(attacks);

                // Focus on the most critical attack
                const primaryAttack = prioritized[0];

                // Analyze attack (Controller)
                const analysis = controller.analyzeAttack(primaryAttack);

                // Generate response plan (Controller)
                const plan = controller.generateResponsePlan(primaryAttack);

                // Get timeline (Controller)
                const timeline = controller.getAttackTimeline(primaryAttack);

                // Identify affected apps (Controller)
                const apps = controller.identifyAffectedApps(primaryAttack);

                // Render (View)
                view.renderAttackHeader(primaryAttack, analysis);
                view.renderResponsePlan(plan);
                view.renderAttackDetails(primaryAttack, timeline, apps);

                view.hideLoading();

                console.log(`Loaded attack incident: ${primaryAttack.uuid}`);
                console.log(`Severity: ${analysis.severity}, Risk Score: ${analysis.riskScore}`);
            } catch (error) {
                view.hideLoading();
                view.showError(`Failed to load dashboard: ${error.message}`);
                console.error('Dashboard error:', error);
            }
        }

        // Start the application
        loadDashboard();
    </script>
</body>
</html>
