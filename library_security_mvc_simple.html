<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Security Report - MVC</title>
    <link rel="stylesheet" href="library_security_styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Library Security Report</h1>
            <p>Third-Party Dependency Analysis - MVC Architecture</p>
        </header>

        <div id="loading" style="display:none; text-align:center; padding:40px;">
            <p style="font-size:1.5em;">Loading libraries...</p>
        </div>

        <div id="error-message" style="display:none; background:rgba(255,68,68,0.2); padding:20px; border-radius:10px; margin:20px 0;"></div>

        <!-- Statistics Grid -->
        <div class="stats-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-bottom:30px;">
            <div class="stat-card" style="background:rgba(255,255,255,0.05); padding:25px; border-radius:12px;">
                <div style="font-size:0.9em; color:#9ca3af; margin-bottom:10px;">TOTAL LIBRARIES</div>
                <div id="stats-total" style="font-size:2.5em; font-weight:700;">0</div>
            </div>
            <div class="stat-card" style="background:rgba(255,255,255,0.05); padding:25px; border-radius:12px;">
                <div style="font-size:0.9em; color:#9ca3af; margin-bottom:10px;">WITH CVEs</div>
                <div id="stats-with-cves" style="font-size:2.5em; font-weight:700; color:#ff6b6b;">0</div>
            </div>
            <div class="stat-card" style="background:rgba(255,255,255,0.05); padding:25px; border-radius:12px;">
                <div style="font-size:0.9em; color:#9ca3af; margin-bottom:10px;">TOTAL CVEs</div>
                <div id="stats-total-cves" style="font-size:2.5em; font-weight:700;">0</div>
            </div>
            <div class="stat-card" style="background:rgba(255,255,255,0.05); padding:25px; border-radius:12px;">
                <div style="font-size:0.9em; color:#9ca3af; margin-bottom:10px;">CRITICAL VULNS</div>
                <div id="stats-critical" style="font-size:2.5em; font-weight:700; color:#ff4444;">0</div>
            </div>
        </div>

        <!-- Grade Distribution -->
        <div style="background:rgba(255,255,255,0.05); padding:25px; border-radius:12px; margin-bottom:30px;">
            <h2 style="margin-bottom:20px;">Grade Distribution</h2>
            <div style="display:flex; gap:20px; flex-wrap:wrap;">
                <div><span style="font-size:1.5em; color:#4ade80;">A:</span> <span id="grade-a">0</span></div>
                <div><span style="font-size:1.5em; color:#60a5fa;">B:</span> <span id="grade-b">0</span></div>
                <div><span style="font-size:1.5em; color:#fbbf24;">C:</span> <span id="grade-c">0</span></div>
                <div><span style="font-size:1.5em; color:#fb923c;">D:</span> <span id="grade-d">0</span></div>
                <div><span style="font-size:1.5em; color:#ff4444;">F:</span> <span id="grade-f">0</span></div>
            </div>
        </div>

        <!-- High Risk Libraries -->
        <h2 style="margin-bottom:20px;">🚨 High Risk Libraries</h2>
        <div id="high-risk-container" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(400px, 1fr)); gap:20px; margin-bottom:40px;"></div>

        <!-- Library Table -->
        <h2 style="margin-bottom:20px;">📋 All Libraries</h2>
        <div style="overflow-x:auto;">
            <table style="width:100%; background:rgba(255,255,255,0.05); border-radius:12px;">
                <thead style="background:rgba(102,126,234,0.2);">
                    <tr>
                        <th style="padding:15px; text-align:left;">Library</th>
                        <th style="padding:15px; text-align:left;">Version</th>
                        <th style="padding:15px; text-align:left;">Grade</th>
                        <th style="padding:15px; text-align:left;">Vulnerabilities</th>
                        <th style="padding:15px; text-align:left;">Age</th>
                        <th style="padding:15px; text-align:left;">Risk</th>
                    </tr>
                </thead>
                <tbody id="library-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- MVC JavaScript -->
    <script type="module">
        // Import MVC classes and ConfigLoader
        import { ConfigLoader } from './src/utils/ConfigLoader.js';
        import { LibrarySecurityModel } from './src/models/LibrarySecurityModel.js';
        import { LibrarySecurityController } from './src/controllers/LibrarySecurityController.js';
        import { LibrarySecurityView } from './src/views/LibrarySecurityView.js';

        // Load credentials from .creds file
        await ConfigLoader.init();

        // Initialize MVC
        const model = new LibrarySecurityModel();
        const controller = new LibrarySecurityController();
        const view = new LibrarySecurityView();

        // Main application logic
        async function loadDashboard() {
            try {
                view.showLoading();
                view.hideError();

                // Fetch data (Model)
                const appId = '14c302ab-f99c-473e-a869-5171663dcab1';
                const libraries = await model.fetchLibraries(appId);

                if (libraries.length === 0) {
                    view.hideLoading();
                    view.showError('No libraries found or API error');
                    return;
                }

                // Transform data (Controller)
                const enrichedLibraries = controller.enrichLibraries(libraries);
                const stats = controller.calculateStats(enrichedLibraries);
                const sortedByRisk = controller.sortByRisk(enrichedLibraries);
                const highRisk = sortedByRisk.slice(0, 3); // Top 3 high-risk

                // Render (View)
                view.updateStats(stats);
                view.renderHighRiskLibraries(highRisk);
                view.renderLibraryTable(sortedByRisk);

                view.hideLoading();

                console.log(`Loaded ${libraries.length} libraries successfully`);
            } catch (error) {
                view.hideLoading();
                view.showError(`Failed to load dashboard: ${error.message}`);
                console.error('Dashboard error:', error);
            }
        }

        // Start the application
        loadDashboard();
    </script>
</body>
</html>
