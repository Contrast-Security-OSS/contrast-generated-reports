<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance & MTTR Executive Dashboard - MVC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e4e7eb;
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .dashboard-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .dashboard-header .subtitle {
            color: #9ca3af;
            font-size: 1.1rem;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 40px;
            font-size: 1.5em;
        }

        #error-message {
            display: none;
            background: rgba(255,68,68,0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid rgba(255,68,68,0.5);
        }

        #kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .kpi-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .kpi-label {
            font-size: 0.9rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #e4e7eb;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
            padding-bottom: 15px;
        }

        .sla-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .sla-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .sla-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .sla-header h3 {
            font-size: 1.2rem;
            color: #fff;
        }

        .sla-percentage {
            font-size: 2rem;
            font-weight: 700;
            padding: 5px 15px;
            border-radius: 8px;
        }

        .sla-excellent {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .sla-good {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .sla-fair {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .sla-poor {
            background: rgba(220, 38, 38, 0.3);
            color: #dc2626;
        }

        .sla-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .sla-stat {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .sla-label {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .sla-value {
            font-weight: 600;
            color: #fff;
        }

        .sla-success {
            color: #10b981;
        }

        .sla-breach {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <h1>📊 Compliance & MTTR Executive Dashboard</h1>
            <p class="subtitle">Real-time security compliance and remediation metrics</p>
        </div>

        <div id="loading" style="display:none;">
            <p>Loading compliance data...</p>
        </div>

        <div id="error-message" style="display:none;"></div>

        <div id="kpi-container"></div>

        <div class="section">
            <h2 class="section-title">🎯 SLA Compliance</h2>
            <div id="sla-container"></div>
        </div>
    </div>

    <!-- MVC JavaScript -->
    <script type="module">
        // Import MVC classes and ConfigLoader
        import { ConfigLoader } from './src/utils/ConfigLoader.js';
        import { PocGeneratorModel } from './src/models/PocGeneratorModel.js';
        import { ComplianceMTTRController } from './src/controllers/ComplianceMTTRController.js';
        import { ComplianceMTTRView } from './src/views/ComplianceMTTRView.js';

        // Load credentials from .creds file
        await ConfigLoader.init();

        // Initialize MVC
        const model = new PocGeneratorModel(); // Reuse model for fetching vulnerabilities
        const controller = new ComplianceMTTRController();
        const view = new ComplianceMTTRView();

        // Main application logic
        async function loadDashboard() {
            try {
                view.showLoading();
                view.hideError();

                // Fetch vulnerabilities (Model)
                const vulns = await model.fetchVulnerabilities({
                    severities: ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'],
                    limit: 500
                });

                if (vulns.length === 0) {
                    view.hideLoading();
                    view.showError('No vulnerability data found');
                    return;
                }

                // Generate executive summary (Controller)
                const summary = controller.generateExecutiveSummary(vulns);

                // Calculate SLA compliance (Controller)
                const sla = controller.calculateSLACompliance(vulns, {
                    CRITICAL: 7,
                    HIGH: 30,
                    MEDIUM: 90,
                    LOW: 180
                });

                // Render (View)
                view.renderKPIs(summary);
                view.renderSLACompliance(sla);

                view.hideLoading();

                console.log(`Loaded compliance data for ${vulns.length} vulnerabilities`);
                console.log(`MTTR: ${summary.mttr} days`);
                console.log(`Compliance Score: ${summary.complianceScore}%`);
            } catch (error) {
                view.hideLoading();
                view.showError(`Failed to load dashboard: ${error.message}`);
                console.error('Dashboard error:', error);
            }
        }

        // Start the application
        loadDashboard();
    </script>
</body>
</html>
